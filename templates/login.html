<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вход в систему</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h2>Вход в систему</h2>

    <!-- Блок для flash-сообщений -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="flash-message
              {% if category == 'error' %}flash-error
              {% elif category == 'success' %}flash-success
              {% else %}flash-info
              {% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="/login" method="post" class="auth-form">
      <div class="form-group">
        <label for="username">Имя пользователя:</label>
        <input type="text" id="username" name="username" placeholder="Введите имя пользователя" required>
      </div>

      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" placeholder="Введите пароль" required>
        <small class="hint"><a href="/forgot-password">Забыли пароль?</a></small>
      </div>

      <button type="submit" class="submit-btn">Войти в систему</button>
    </form>

    <div class="login-link">
      Нет аккаунта? <a href="/register">Зарегистрируйтесь</a>
    </div>
	
  <script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
      var username = document.getElementById('username').value || '';
      if (username.length < 3) {
        alert('Имя должно быть не меньше 3 символов');
        e.preventDefault();
        return;
      }
      // Безопасный вывод текста
      document.getElementById('welcome').textContent = "Привет, " + username + "!";
    });
  </script>
	
  </div>
</body>
</html>
