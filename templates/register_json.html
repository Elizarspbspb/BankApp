<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Регистрация</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
 <div class="container">
  <h2>Регистрация</h2>

    <!-- Блок для flash-сообщений -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="flash-message
              {% if category == 'error' %}flash-error
              {% elif category == 'success' %}flash-success
              {% else %}flash-info
              {% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

  <form id="regForm" action="/register_json" method="post" autocomplete="off" novalidate class="auth-form">
	<input type="hidden" name="csrf_token" value="{{ csrf_token }}">

   <div class="form-group">
    <label for="username">Имя пользователя</label>
    <input id="username" name="username" required maxlength="30" pattern="[A-Za-z0-9_.-]{3,30}" title="3–30 символов (латиница, цифры, _ . -)"><br>
   </div>
   
   <div class="form-group">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required maxlength="254"><br>
   </div>
   
   <div class="form-group">
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"><br>
   </div>
   
    <button type="submit" class="submit-btn">Зарегистрироваться</button>
  </form>

	<div class="login-link">
      Есть аккаунт? <a href="/login">Войдите</a>
    </div>
	
  <div id="welcome"></div>

  <script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
      var username = document.getElementById('username').value || '';
      if (username.length < 3) {
        alert('Имя должно быть не меньше 3 символов');
        e.preventDefault();
        return;
      }
      // Безопасный вывод текста
      document.getElementById('welcome').textContent = "Привет, " + username + "!";
    });
  </script>
 </div>
</body>
</html>
